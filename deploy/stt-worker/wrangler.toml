name = "stt-worker"
main = "worker.js"
compatibility_date = "2024-11-01"

# Даёт env.AI — модель выполняется внутри Cloudflare, исходящих запросов нет.
[ai]
binding = "AI"

# Необязательная подсказка языка (улучшает распознавание сумм на русском).
# Секрет PROXY_SECRET задаётся отдельно: wrangler secret put PROXY_SECRET
[vars]
WHISPER_LANGUAGE = "ru"
